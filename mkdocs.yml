site_name: DDS AutoDiag
site_description: Find out why your ROS 2 nodes can't talk to each other. Read-only ROS 2 / DDS diagnostics with an AI assistant and AI-driven RViz configuration.
site_author: Animesh Gunaki
repo_name: Animesh2507/dds-autodiag
repo_url: https://github.com/Animesh2507/dds-autodiag
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Animesh Gunaki · MIT License

theme:
  name: material
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
  - Guides:
      - Web dashboard: guides/dashboard.md
      - Command line: guides/cli.md
      - Compare hosts & containers: guides/compare-hosts.md
      - RViz2 panel: guides/rviz-panel.md
      - Configure RViz with AI: guides/configure-rviz.md
      - AI providers: guides/ai-providers.md
      - Deployment: guides/deployment.md
  - How it works:
      - How diagnosis works: concepts/diagnosis.md
      - RAG & AI pipeline: concepts/rag.md
      - Security model: concepts/security.md
  - Architecture:
      - Overview: architecture/index.md
      - Containers: architecture/containers.md
      - Components:
          - Collector & probes: architecture/components/collector.md
          - Rule engine: architecture/components/rule-engine.md
          - AI layer: architecture/components/ai-layer.md
          - RViz planner: architecture/components/rviz-planner.md
          - Server & security: architecture/components/server.md
          - RViz panel: architecture/components/rviz-panel.md
      - Data model: architecture/data-model.md
      - Runtime flows: architecture/flows.md
      - Design decisions: architecture/decisions.md
      - Extending: architecture/extending.md
      - Quality & testing: architecture/quality.md
  - Reference:
      - Diagnostic rules: reference/rules.md
      - Configuration: reference/configuration.md
      - REST API: reference/rest-api.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Changelog: changelog.md

not_in_nav: |
  archive/*.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Animesh2507/dds-autodiag
