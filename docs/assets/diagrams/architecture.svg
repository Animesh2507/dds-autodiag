<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="ad-diagram" viewBox="0 0 900 300" role="img" aria-label="Architecture: the CLI, web dashboard and RViz2 panel talk to the AutoDiag server, which runs the rule engine, the RAG and AI layer and the RViz planner against the ROS 2 / DDS graph">
<defs><marker id="ad-arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ad-arrow" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="ad-label" x="105" y="20" text-anchor="middle">Interfaces</text>
<text class="ad-label" x="385" y="20" text-anchor="middle">Server</text>
<text class="ad-label" x="645" y="20" text-anchor="middle">Engines</text>
<text class="ad-label" x="830" y="20" text-anchor="middle">System</text>
<rect class="ad-box" x="20" y="35" width="170" height="50" rx="10"/><text class="ad-title" x="105" y="58" text-anchor="middle">CLI</text><text class="ad-sub" x="105" y="75" text-anchor="middle">dds-autodiag check</text>
<rect class="ad-box" x="20" y="125" width="170" height="50" rx="10"/><text class="ad-title" x="105" y="148" text-anchor="middle">Web dashboard</text><text class="ad-sub" x="105" y="165" text-anchor="middle">127.0.0.1:8080</text>
<rect class="ad-box" x="20" y="215" width="170" height="50" rx="10"/><text class="ad-title" x="105" y="238" text-anchor="middle">RViz2 panel</text><text class="ad-sub" x="105" y="255" text-anchor="middle">health · topics · AI</text>
<rect class="ad-box ad-box--primary" x="290" y="95" width="190" height="110" rx="12"/><text class="ad-title" x="385" y="140" text-anchor="middle">AutoDiag server</text><text class="ad-sub" x="385" y="160" text-anchor="middle">FastAPI · read-only</text><text class="ad-sub" x="385" y="177" text-anchor="middle">REST + streaming</text>
<rect class="ad-box" x="560" y="35" width="170" height="50" rx="10"/><text class="ad-title" x="645" y="58" text-anchor="middle">Rule engine</text><text class="ad-sub" x="645" y="75" text-anchor="middle">QoS · domain · discovery</text>
<rect class="ad-box ad-box--accent" x="560" y="125" width="170" height="50" rx="10"/><text class="ad-title" x="645" y="148" text-anchor="middle">RAG + AI</text><text class="ad-sub" x="645" y="165" text-anchor="middle">local or cloud models</text>
<rect class="ad-box" x="560" y="215" width="170" height="50" rx="10"/><text class="ad-title" x="645" y="238" text-anchor="middle">RViz planner</text><text class="ad-sub" x="645" y="255" text-anchor="middle">validated display plans</text>
<rect class="ad-box" x="780" y="95" width="100" height="110" rx="12"/><text class="ad-title" x="830" y="145" text-anchor="middle">ROS 2</text><text class="ad-title" x="830" y="163" text-anchor="middle">DDS</text><text class="ad-sub" x="830" y="181" text-anchor="middle">graph</text>
<path id="ad-p1" class="ad-line" d="M190 60 C240 60 240 130 290 130" marker-end="url(#ad-arr-a)"/>
<path id="ad-p2" class="ad-line" d="M190 150 L290 150" marker-end="url(#ad-arr-a)"/>
<path id="ad-p3" class="ad-line" d="M190 240 C240 240 240 170 290 170" marker-end="url(#ad-arr-a)"/>
<path id="ad-p4" class="ad-line" d="M480 130 C520 130 520 60 560 60" marker-end="url(#ad-arr-a)"/>
<path id="ad-p5" class="ad-line" d="M480 150 L560 150" marker-end="url(#ad-arr-a)"/>
<path id="ad-p6" class="ad-line" d="M480 170 C520 170 520 240 560 240" marker-end="url(#ad-arr-a)"/>
<path id="ad-p7" class="ad-line" d="M730 60 C755 60 755 130 780 130" marker-end="url(#ad-arr-a)"/>
<path id="ad-p8" class="ad-line" d="M730 240 C755 240 755 170 780 170" marker-end="url(#ad-arr-a)"/>
<circle class="ad-packet" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#ad-p1"/></animateMotion></circle>
<circle class="ad-packet" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.8s"><mpath xlink:href="#ad-p2"/></animateMotion></circle>
<circle class="ad-packet" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath xlink:href="#ad-p3"/></animateMotion></circle>
<circle class="ad-packet" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s"><mpath xlink:href="#ad-p4"/></animateMotion></circle>
<circle class="ad-packet" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s"><mpath xlink:href="#ad-p5"/></animateMotion></circle>
<circle class="ad-packet" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="2s"><mpath xlink:href="#ad-p6"/></animateMotion></circle>
<circle class="ad-packet" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s"><mpath xlink:href="#ad-p7"/></animateMotion></circle>
<circle class="ad-packet" r="4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.8s"><mpath xlink:href="#ad-p8"/></animateMotion></circle>
</svg>
