<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="ad-diagram" viewBox="0 0 900 175" role="img" aria-label="RAG pipeline: question and findings, retrieval, excerpts, model, cited answer">
<defs><marker id="ad-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ad-arrow" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="ad-box ad-step" style="animation-duration:6.0s;animation-delay:0.0s" x="15.0" y="30" width="156.4" height="80" rx="12"/>
<text class="ad-label" x="93.2" y="20" text-anchor="middle">Step 1</text>
<text class="ad-title" x="93.2" y="66" text-anchor="middle">Ask</text>
<text class="ad-sub" x="93.2" y="86" text-anchor="middle">question + findings</text>
<text class="ad-sub" x="93.2" y="140" text-anchor="middle">sanitized context</text>
<path class="ad-line" d="M171.4 70 L193.4 70" marker-end="url(#ad-arr-r)"/>
<rect class="ad-box ad-step" style="animation-duration:6.0s;animation-delay:1.2s" x="193.4" y="30" width="156.4" height="80" rx="12"/>
<text class="ad-label" x="271.6" y="20" text-anchor="middle">Step 2</text>
<text class="ad-title" x="271.6" y="66" text-anchor="middle">Retrieve</text>
<text class="ad-sub" x="271.6" y="86" text-anchor="middle">BM25 ± embeddings</text>
<text class="ad-sub" x="271.6" y="140" text-anchor="middle">curated official docs</text>
<path class="ad-line" d="M349.8 70 L371.8 70" marker-end="url(#ad-arr-r)"/>
<rect class="ad-box ad-step" style="animation-duration:6.0s;animation-delay:2.4s" x="371.8" y="30" width="156.4" height="80" rx="12"/>
<text class="ad-label" x="450.0" y="20" text-anchor="middle">Step 3</text>
<text class="ad-title" x="450.0" y="66" text-anchor="middle">Ground</text>
<text class="ad-sub" x="450.0" y="86" text-anchor="middle">top-3 excerpts</text>
<text class="ad-sub" x="450.0" y="140" text-anchor="middle">cited by id</text>
<path class="ad-line" d="M528.2 70 L550.2 70" marker-end="url(#ad-arr-r)"/>
<rect class="ad-box ad-step" style="animation-duration:6.0s;animation-delay:3.6s" x="550.2" y="30" width="156.4" height="80" rx="12"/>
<text class="ad-label" x="628.4" y="20" text-anchor="middle">Step 4</text>
<text class="ad-title" x="628.4" y="66" text-anchor="middle">Generate</text>
<text class="ad-sub" x="628.4" y="86" text-anchor="middle">local or cloud</text>
<text class="ad-sub" x="628.4" y="140" text-anchor="middle">streamed tokens</text>
<path class="ad-line" d="M706.6 70 L728.6 70" marker-end="url(#ad-arr-r)"/>
<rect class="ad-box ad-step" style="animation-duration:6.0s;animation-delay:4.8s" x="728.6" y="30" width="156.4" height="80" rx="12"/>
<text class="ad-label" x="806.8" y="20" text-anchor="middle">Step 5</text>
<text class="ad-title" x="806.8" y="66" text-anchor="middle">Answer</text>
<text class="ad-sub" x="806.8" y="86" text-anchor="middle">with real links</text>
<text class="ad-sub" x="806.8" y="140" text-anchor="middle">findings stay truth</text>
<path id="ad-arr-r-track" class="ad-line" style="stroke:none" d="M15 118 L885 118"/>
<circle class="ad-packet" r="4"><animateMotion dur="6.0s" repeatCount="indefinite"><mpath xlink:href="#ad-arr-r-track"/></animateMotion></circle>
</svg>
